[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jupyter-mcp"
version = "1.0.0"
description = "MCP server that keeps a real local Jupyter Python kernel alive for stateful runs - keyless."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
keywords = ["mcp", "jupyter", "python", "kernel", "notebook", "local", "keyless"]
dependencies = [
  "mcp==1.9.4",
  "pydantic==2.9.2",
  "jupyter-client>=8.6,<9",
  "ipykernel>=6.29,<8",
]

[project.scripts]
jupyter-mcp = "jupyter_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jupyter_mcp"]
