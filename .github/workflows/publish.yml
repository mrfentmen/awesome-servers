name: Publish MCP servers

on:
  # Manual: publish a slice, e.g. start=1 end=100
  workflow_dispatch:
    inputs:
      start:
        description: "First server index (1-based, alphabetical)"
        required: false
        default: "1"
      end:
        description: "Last server index (0 = all)"
        required: false
        default: "0"
      servers:
        description: "Explicit newline-separated server list (overrides start/end)"
        required: false
        default: ""
  # Automatic: publish only servers changed by a push to main
  push:
    branches: [main]
    paths: ["mcp/servers/**"]

concurrency:
  group: publish-mcp-servers
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for registry OIDC auth (no device codes)
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Install mcp-publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          TAG=$(gh release view --repo modelcontextprotocol/registry --json tagName --jq .tagName)
          for attempt in 1 2 3 4 5; do
            rm -f "/tmp/mcp-publisher_${OS}_${ARCH}.tar.gz" mcp-publisher
            if gh release download "$TAG" --repo modelcontextprotocol/registry --pattern "mcp-publisher_${OS}_${ARCH}.tar.gz" --dir /tmp --clobber && tar -xzf "/tmp/mcp-publisher_${OS}_${ARCH}.tar.gz" mcp-publisher; then
              break
            fi
            echo "mcp-publisher download failed (attempt $attempt), retrying in 5s"
            sleep 5
          done
          test -x mcp-publisher || { echo "mcp-publisher download failed after retries"; exit 1; }
          sudo mv mcp-publisher /usr/local/bin/

      - name: Determine server list
        id: list
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.servers }}" ]; then
              printf '%s' "${{ inputs.servers }}" | tr -s '[:space:]' '\n' | grep . > /tmp/todo.txt
            else
              START="${{ inputs.start }}"
              END="${{ inputs.end }}"
              if [ "$END" = "0" ]; then
                ls -d mcp/servers/*/ | sed 's|mcp/servers/||;s|/||' | sort | sed -n "${START},\$p" > /tmp/todo.txt
              else
                ls -d mcp/servers/*/ | sed 's|mcp/servers/||;s|/||' | sort | sed -n "${START},${END}p" > /tmp/todo.txt
              fi
            fi
          else
            git diff --name-only HEAD~1 -- mcp/servers/ | cut -d/ -f3 | sort -u > /tmp/todo.txt
          fi
          wc -l /tmp/todo.txt

      - name: Publish batch
        run: cd mcp && bash scripts/publish-batch-list.sh /tmp/todo.txt
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
